<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7b1fa2">
<title>Venkateshwara Kattela Adithi</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}
header {
  background: #7b1fa2;
  color: white;
  text-align: center;
  padding: 18px 10px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: bold;
}

.save {
  width: 100%;
  background: #7b1fa2;
  color: white;
}

.clear {
  background: #ddd;
  color: #222;
}

.delete {
  background: #d32f2f;
  color: white;
  padding: 7px 10px;
  margin: 0;
  font-size: 12px;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.summary-box {
  background: #fafafa;
  padding: 13px;
  text-align: center;
  border-radius: 10px;
  border: 1px solid #eee;
}

.summary-box strong {
  display: block;
  margin-top: 6px;
  font-size: 18px;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 750px;
}

th, td {
  border: 1px solid #ddd;
  padding: 9px;
  text-align: center;
  white-space: nowrap;
}

th {
  background: #7b1fa2;
  color: white;
}

tr:nth-child(even) {
  background: #fafafa;
}

.balance {
  font-weight: bold;
}

.empty {
  padding: 20px;
  color: #777;
}

@media (min-width: 650px) {
  .form-grid {
    grid-template-columns: 1fr 1fr;
  }

  .summary {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
🙏 Venkateshwara Kattela Adithi
</header>

<div class="container">

<!-- ADD ENTRY -->
<div class="card">

<h2>➕ Add Daily Entry</h2>

<div class="form-grid">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Income (₹)</label>
<input type="number" id="income" min="0" step="0.01" placeholder="0">
</div>

<div>
<label>Investment (₹)</label>
<input type="number" id="investment" min="0" step="0.01" placeholder="0">
</div>

<div>
<label>Daily Spending (₹)</label>
<input type="number" id="spending" min="0" step="0.01" placeholder="0">
</div>

</div>

<button class="save" onclick="addEntry()">
Save Entry
</button>

<button class="clear" onclick="clearForm()">
Clear
</button>

</div>


<!-- SUMMARY -->
<div class="card">

<h2>📊 Summary</h2>

<div class="summary">

<div class="summary-box">
Total Income
<strong id="totalIncome">₹0.00</strong>
</div>

<div class="summary-box">
Total Investment
<strong id="totalInvestment">₹0.00</strong>
</div>

<div class="summary-box">
Total Spending
<strong id="totalSpending">₹0.00</strong>
</div>

<div class="summary-box">
Current Balance
<strong id="currentBalance">₹0.00</strong>
</div>

</div>

</div>


<!-- RECORDS -->
<div class="card">

<h2>📅 Daily Records</h2>

<div class="table-container">

<table>

<thead>

<tr>
<th>S.No</th>
<th>Date</th>
<th>Income</th>
<th>Investment</th>
<th>Daily Spending</th>
<th>Balance</th>
<th>Action</th>
</tr>

</thead>

<tbody id="records"></tbody>

</table>

</div>

</div>

</div>


<script>

/* Load saved records */

let entries =
JSON.parse(localStorage.getItem("venkateshwaraEntries")) || [];


/* Today's date */

document.getElementById("date").value =
new Date().toISOString().split("T")[0];


/* Money format */

function money(amount) {

return "₹" + Number(amount).toLocaleString("en-IN", {
minimumFractionDigits: 2,
maximumFractionDigits: 2
});

}


/* Add entry */

function addEntry() {

const date =
document.getElementById("date").value;

const income =
Number(document.getElementById("income").value) || 0;

const investment =
Number(document.getElementById("investment").value) || 0;

const spending =
Number(document.getElementById("spending").value) || 0;


if (!date) {

alert("Please select a date.");

return;

}


if (income < 0 || investment < 0 || spending < 0) {

alert("Amounts cannot be negative.");

return;

}


/* Create entry */

const entry = {

id: Date.now(),

date: date,

income: income,

investment: investment,

spending: spending

};


entries.push(entry);


/* Sort by date */

entries.sort(function(a,b) {

return new Date(a.date) - new Date(b.date);

});


saveData();

clearForm();

displayEntries();

}


/* Delete entry */

function deleteEntry(id) {

if (!confirm("Are you sure you want to delete this entry?")) {

return;

}


entries =
entries.filter(function(entry) {

return entry.id !== id;

});


saveData();

displayEntries();

}


/* Save data */

function saveData() {

localStorage.setItem(
"venkateshwaraEntries",
JSON.stringify(entries)
);

}


/* Clear form */

function clearForm() {

document.getElementById("income").value = "";

document.getElementById("investment").value = "";

document.getElementById("spending").value = "";

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

}


/* Format date */

function formatDate(date) {

const parts = date.split("-");

return parts[2] + "/" + parts[1] + "/" + parts[0];

}


/* Display records */

function displayEntries() {

const table =
document.getElementById("records");

table.innerHTML = "";


let runningBalance = 0;

let totalIncome = 0;

let totalInvestment = 0;

let totalSpending = 0;


if (entries.length === 0) {

table.innerHTML = `

<tr>

<td colspan="7" class="empty">

No records yet. Add your first entry.

</td>

</tr>

`;

}


/* Calculate each day's balance */

entries.forEach(function(entry, index) {


/*
MAIN FORMULA:

Previous Balance
+ Today's Income
- Today's Investment
- Today's Spending
= Today's Balance
*/

runningBalance =
runningBalance
+ entry.income
- entry.investment
- entry.spending;


totalIncome += entry.income;

totalInvestment += entry.investment;

totalSpending += entry.spending;


const row =
document.createElement("tr");


row.innerHTML = `

<td>${index + 1}</td>

<td>${formatDate(entry.date)}</td>

<td>${money(entry.income)}</td>

<td>${money(entry.investment)}</td>

<td>${money(entry.spending)}</td>

<td class="balance">
${money(runningBalance)}
</td>

<td>

<button
class="delete"
onclick="deleteEntry(${entry.id})">

Delete

</button>

</td>

`;


table.appendChild(row);

});


/* Update summary */

document.getElementById("totalIncome").textContent =
money(totalIncome);

document.getElementById("totalInvestment").textContent =
money(totalInvestment);

document.getElementById("totalSpending").textContent =
money(totalSpending);

document.getElementById("currentBalance").textContent =
money(runningBalance);

}


/* Start app */

displayEntries();

</script>

</body>
</html>
